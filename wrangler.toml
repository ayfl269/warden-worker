# Warden — Bitwarden-compatible server for Cloudflare Workers (TypeScript).
# Replace the D1/KV ids before deploying.

name = "warden-worker-ts"
main = "src/index.ts"
compatibility_date = "2025-09-19"
# Required for `node:crypto.pbkdf2Sync` (600k iterations exceed the WebCrypto cap).
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true
preview_urls = false

[durable_objects]
bindings = [
  { name = "HEAVY_DO", class_name = "HeavyDo" },
  { name = "NOTIFY_DO", class_name = "NotifyDo" }
]

[[migrations]]
tag = "do_v1"
new_sqlite_classes = ["HeavyDo"]

[[migrations]]
tag = "do_v2"
new_sqlite_classes = ["NotifyDo"]

# Staging uses dedicated rate-limit namespaces so it never shares counters
# with production (1001/1003) or the Rust dev environment (1002/1004).
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SEND_ACCESS_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 15, period = 60 }

[[d1_databases]]
binding = "vault1"
database_name = "vault1"
# Local dev ignores this value. Replace it with the id `wrangler d1 create` prints.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Attachments (optional). Add the id from `wrangler kv namespace create ATTACHMENTS_KV`;
# without it wrangler skips the binding and attachment endpoints stay disabled.
[[kv_namespaces]]
binding = "ATTACHMENTS_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# R2 takes priority over KV when bound.
# [[r2_buckets]]
# binding = "ATTACHMENTS_BUCKET"
# bucket_name = "warden-attachments"

[triggers]
crons = ["0 3 * * *"]

# Static assets: the Bitwarden Web Vault frontend.
#
# `public/web-vault` is not committed; `npm run frontend` (also wired as the
# `predev`/`predeploy` hook) downloads a pinned bw_web_builds release into it.
# Requests outside `run_worker_first` are answered by the assets layer and never
# reach the Worker, which is what keeps static traffic off the CPU budget.
[assets]
directory = "./public/web-vault"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Only invoke the Worker for API, Identity and notification routes; everything
# else is served straight from the asset store.
run_worker_first = ["/api/*", "/identity/*", "/notifications/*"]

[vars]
