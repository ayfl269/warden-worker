name: TypeScript CI

on:
  push:
    branches: [main, master, uat, release*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx biome check .

      - name: Unit tests
        run: npm test

      - name: Build PBKDF2 WebAssembly module
        run: npm run build:wasm

      - name: Download Web Vault frontend
        run: npm run frontend
        env:
          BW_WEB_VERSION: ${{ vars.BW_WEB_VERSION || 'v2026.10.1' }}

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
